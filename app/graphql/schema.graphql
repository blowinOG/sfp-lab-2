directive @isAuthenticated on FIELD_DEFINITION
directive @isAdmin on FIELD_DEFINITION

scalar JSON

type User {
  id: Int!
  email: String!
  isActive: Boolean!
  isAdmin: Boolean!
  createdAt: String!
}

type Client {
  id: Int!
  clientId: String!
  name: String!
  isConfidential: Boolean!
  redirectUris: [String!]!
  createdAt: String!
}

type AuditEvent {
  id: Int!
  eventType: String!
  actorId: Int
  clientId: String
  ip: String
  userAgent: String
  metadata: JSON!
  createdAt: String!
}

type AuthPayload {
  accessToken: String!
  tokenType: String!
}

type Query {
  me: User! @isAuthenticated
  users(search: String, limit: Int = 50, offset: Int = 0): [User!]! @isAdmin
  clients: [Client!]! @isAdmin
  auditEvents(eventType: String, limit: Int = 50, offset: Int = 0): [AuditEvent!]! @isAdmin
}

type Mutation {
  registerUser(email: String!, password: String!): AuthPayload!
  createClient(name: String!, isConfidential: Boolean = true): Client! @isAdmin
  disableUser(userId: Int!): User! @isAdmin
}